[project]
name = "lull"
version = "0.2.0"
description = "Audio description engine: gap-fitted, frame-verified descriptions for prerecorded video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "ortools>=9.10",
    "typer>=0.12",
    "numpy>=1.26",
    "jinja2>=3.1",
    "fastapi>=0.162.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
lull = "lull.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lull"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Token Factory API (needs LULL_LIVE=1)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
