[project]
name = "lull-eval"
version = "0.1.0"
description = "Reproducible evaluation suites for the Lull audio-description engine."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "lull",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[tool.uv]
package = false

[tool.uv.sources]
lull = { path = "../engine", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
